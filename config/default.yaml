# ev-gateway config. Every block here has a boot-fail behind it in
# apps/gateway/config.py -- see check_invariants().

mode: demo                      # demo only; live exits non-zero
timezone: "Asia/Ho_Chi_Minh"    # IANA required; "local" exits
dev: false                      # true relaxes the loopback-bind check only
db_path: "var/ev.sqlite3"

broker:
  adapter: ctrader              # only value
  host: "demo.ctraderapi.com"   # a live host exits
  port: 5035
  proto: protobuf
  account_id_env: CT_ACCOUNT_ID
  token_env: CT_ACCESS_TOKEN
  refresh_env: CT_REFRESH_TOKEN
  client_id_env: CT_CLIENT_ID
  client_secret_env: CT_CLIENT_SECRET

symbols:
  - name: XAUUSD
    max_spread: 0.80
    max_lots: 0.10
    default_lots: 0.01
    lot_step: 0.01
  - name: EURUSD
    max_lots: 0.50
    default_lots: 0.10
    lot_step: 0.01
  - name: GBPUSD
    max_lots: 0.50
    default_lots: 0.10
    lot_step: 0.01
  - name: USDJPY
    max_lots: 0.50
    default_lots: 0.10
    lot_step: 0.01

session:
  days: [sun, mon, tue, wed, thu, fri]
  start: "18:00"
  end: "23:30"

risk:
  max_positions: 1
  max_daily_loss_usd: 200
  min_seconds_between_orders: 2
  panic_flatten_on_disconnect: false
  r_unit_usd: 20                # R when there is no SL at entry -- see risk/r.py
  default_stop:                 # price units, per symbol
    XAUUSD: 2.00
    EURUSD: 0.0010
    GBPUSD: 0.0012
    USDJPY: 0.15

gateway:
  listen: "127.0.0.1:8444"      # a public bind exits unless dev: true
  static_dir: "app/dist"        # the gateway serves the HUD itself
  ws_path: "/ws"                # same origin as the HUD
  public_origin: "https://YOUR_DOMAIN"
  token_env: EV_WS_TOKEN
  heartbeat_s: 1
  heartbeat_dead_s: 3
  max_frame_bytes: 65536

ui:
  theme: dark                   # the only supported theme in v1
  desktop_only: true

voice:                          # phase 8
  enabled: true
  stt:
    mode: local                 # local | off -- anything else exits
    model: small.en
    lang: en
  bindings: ["LB+RB", "key:V"]  # LT/RT/A/B/X/Y exits
  hold_stream: true
  max_seconds: 60
  max_bytes: 262144
  max_uploads_per_hour: 60
  stt_timeout_s: 60
  audio_retention_days: 365
  tts: "off"

tape:                           # phase 2 records, phase 10 replays
  dt_s: 1
  ring_minutes: 90
  pre_roll_s: 300
  post_roll_s: 300
  retention_days: 730

tilt:                           # phase 9
  enabled: true
  gate_close: false             # true exits
  warm: 0.35
  hot: 0.60
  scorched: 0.80
  confirm_hold_ms: 750
  cooldown_s: 300

score:                          # phase 11 -- weights must sum to 1.0 or exit
  trades_max: 6
  band_width: 1
  decline_credit_max: 15
  weights:
    adherence: 0.30
    selectivity: 0.25
    risk_discipline: 0.20
    preparation: 0.15
    review: 0.10

playbook:                       # phase 7
  seed_volman: true
  allow_custom: true

copilot:                        # phase 4
  enabled: true
  on_hot_path: false            # true exits
  model: grok-4
  api_key_env: XAI_API_KEY
  min_interval_s: 1
  max_interval_s: 30

tradingview:                    # phase 4
  enabled: false
  auto_trade: false             # true exits
  secret_env: TV_WEBHOOK_SECRET
