[project]
name = "ev-gateway"
version = "0.1.0"
description = "Evening Forex Gold Gamepad — single-process gateway: WS, REST, risk, journal, static HUD, cTrader link"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "ctrader-open-api>=0.9.2",
    "service-identity>=24.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
