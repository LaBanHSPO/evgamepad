[project]
name = "ev-gateway"
version = "0.1.0"
description = "Evening Forex Gold Gamepad — the single Python gateway process"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-ulid>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Twisted-based cTrader Open API client. Phase 2 wires it; the rest of the
# gateway imports nothing from it, so the core installs without it.
broker = ["ctrader-open-api>=0.9.2"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx2"]

[project.scripts]
ev-gateway = "apps.gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pytest.ini_options]
testpaths = ["apps/gateway"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "auto"
