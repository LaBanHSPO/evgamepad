# Optional: serve the React HUD from the same Ubuntu VPS on a different hostname.
# Copy to /etc/nginx/sites-available/ and replace YOUR_HUD_ORIGIN.
#
# Build on the VPS (or CI) with:
#   cd app && VITE_GATEWAY_ORIGIN=https://gw.bobvolman.com npm ci && npm run build
#   sudo rsync -a --delete dist/ /var/www/evgamepad-arcade/
#
# The HUD origin (this vhost) must be listed on the gateway as EV_PUBLIC_ORIGIN.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_HUD_ORIGIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/evgamepad-arcade;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker or the HTML shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
