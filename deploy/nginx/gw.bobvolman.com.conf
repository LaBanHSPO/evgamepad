# Gateway reverse proxy for gw.bobvolman.com
#
# This file is included from `http {}` (Ubuntu: /etc/nginx/sites-enabled/).
# The `map` belongs at http scope, which is correct for sites-enabled.
#
# Install:
#   sudo cp deploy/nginx/gw.bobvolman.com.conf /etc/nginx/sites-available/gw.bobvolman.com
#   sudo ln -sf /etc/nginx/sites-available/gw.bobvolman.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gw.bobvolman.com
#
# After certbot, keep the proxy headers below on the 443 `location /` block.
# Do not publish container port 8444 on the WAN.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ev_gateway {
    server 127.0.0.1:8444;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name gw.bobvolman.com;

    # ACME http-01 (certbot) and everything else to the gateway.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://ev_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Game socket stays open for the evening; default 60s would drop it.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
